name: Carrossel mensal — bolsas e moedas

on:
  schedule:
    # Dia 1 de cada mês, 12:30 UTC (09:30 em Brasília)
    - cron: "30 12 1 * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Instagram? (nao / mes / 12m / ambos)"
        default: "ambos"

permissions:
  contents: write

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install yfinance pandas requests pillow playwright
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Coletar dados (mês encerrado + 12 meses)
        run: python scripts/coleta_dados.py

      - name: Renderizar cards (JPEG 1080x1350)
        run: python scripts/render_cards.py

      - name: Publicar avisos de sanidade no log
        if: always()
        run: |
          if [ -f output/avisos.txt ]; then
            echo "::warning::Avisos de coleta encontrados:"
            cat output/avisos.txt
          fi

      # As imagens precisam de URL pública p/ a Graph API → commit no repo.
      - name: Commitar cards no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/cards/*.jpg output/dados.json output/composicao_log.csv
          git commit -m "cards $(date +%Y-%m)" || echo "nada a commitar"
          git push

      - name: Publicar no Instagram (2 carrosséis)
        if: ${{ github.event.inputs.publicar != 'nao' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output/cards
        run: python scripts/publicar_instagram.py "${{ github.event.inputs.publicar || 'ambos' }}"

      - name: Backup por Telegram (opcional — usa seus secrets existentes)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ]; then
            for f in output/cards/*.jpg; do
              curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F photo=@"$f" \
                "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" > /dev/null
            done
          fi

      - name: Guardar artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_number }}
          path: |
            output/cards/*.jpg
            output/dados.json
            output/composicao_log.csv
